<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Memorial Bricks · American Legion Post 779</title>
    <meta
      name="description"
      content="Find a memorial brick at American Legion Post 779 in Centre Hall, PA. Type a name to see where it is in the plaza."
    />
    <meta name="theme-color" content="#14243d" />
    <link rel="canonical" href="https://pjpuzzler.github.io/legion-bricks/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="American Legion Post 779" />
    <meta property="og:url" content="https://pjpuzzler.github.io/legion-bricks/" />
    <meta property="og:title" content="Memorial Bricks · American Legion Post 779" />
    <meta property="og:description" content="Type a name to see where its brick is in the memorial plaza." />
    <!-- Bump ?v= when the picture changes, so apps that cached the old one fetch it again. -->
    <meta property="og:image" content="https://pjpuzzler.github.io/legion-bricks/img/share.jpg?v=14" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A map of the memorial plaza with a red pin on one brick" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Memorial Bricks" />
    <!-- Opened from the Home Screen: full screen, header running up behind the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Marks Safari (not Chrome and the rest) before anything is drawn. The
         page background depends on it sideways (see style.css). -->
    <script>
      if (/Version\/[\d.]+ .*Safari\//.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(navigator.userAgent))
        document.documentElement.classList.add("is-safari");
    </script>
    <link rel="preload" href="fonts/brick-sans-bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The map waits for the flags and the weather before it fades in. -->
    <link rel="preload" href="img/flags-sm.webp" as="image" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <img class="brand-emblem" src="img/legion-emblem.webp" alt="" width="40" height="40" />
        <span class="brand-text">
          <span class="brand-kicker">American Legion Post 779</span>
          <span class="brand-title">Memorial Bricks</span>
        </span>
      </a>
      <button class="topbar-btn" id="about-open" type="button" aria-haspopup="dialog">About</button>
    </header>

    <main class="main">
      <aside class="side" id="side" aria-label="Find a brick">
        <div class="search">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 3a7 7 0 1 0 4.4 12.4l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0 0 10 3Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Type a name"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
              role="combobox"
              aria-expanded="true"
              aria-controls="results"
              aria-label="Type a name to find its brick"
            />
            <button class="search-clear" id="search-clear" type="button" aria-label="Clear" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6Z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="side-body">
          <section class="card" id="card" aria-live="polite" hidden></section>
          <section class="results-panel" aria-label="Names">
            <div class="results-bar">
              <p class="results-head" id="results-head"></p>
              <button class="results-close" id="results-close" type="button">Back to map</button>
            </div>
            <ol class="results" id="results" role="listbox" aria-label="Names"></ol>
          </section>
        </div>
      </aside>

      <section class="map-wrap" id="map-wrap" aria-label="Map of the memorial plaza">
        <canvas class="map" id="map" tabindex="0" role="img" aria-label="Map of the brick plaza"></canvas>
        <div class="marker" id="marker" hidden aria-hidden="true">
          <span class="marker-ring"></span>
          <span class="marker-pin"></span>
        </div>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="map-controls">
          <!-- Only shown once there's more of the plaza to show. -->
          <button class="map-btn" id="zoom-fit" type="button" aria-label="Show the whole plaza" title="Show the whole plaza" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z" />
            </svg>
          </button>
          <button class="map-btn" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg>
          </button>
          <button class="map-btn" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z" /></svg>
          </button>
          <!-- Turning the map is only for the editor, to match up photos. -->
          <button class="map-btn" id="rotate" type="button" aria-label="Turn the map" title="Turn the map" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" /></svg>
          </button>
        </div>
      </section>
    </main>

    <dialog class="about" id="about" aria-labelledby="about-title">
      <div class="about-head">
        <img src="img/legion-emblem.webp" alt="" width="48" height="48" />
        <div>
          <p class="about-kicker">American Legion Post 779</p>
          <h2 id="about-title" tabindex="-1" autofocus>Memorial Bricks</h2>
        </div>
      </div>
      <p class="about-text" id="about-text">Engraved bricks honoring veterans and the post's charter members.</p>
      <div class="stats" id="stats"></div>
      <div class="about-foot">
        <p class="credit">Made by <span class="credit-name">Patrick Johnson</span></p>
        <div class="about-actions">
          <a
            class="btn"
            href="https://www.google.com/maps/search/?api=1&query=American+Legion+Post+779%2C+2928+Earlystown+Rd%2C+Centre+Hall%2C+PA"
            target="_blank"
            rel="noopener"
            >Directions</a
          >
          <button class="btn btn-primary" type="button" data-close>OK</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="data/bricks.js"></script>
    <script src="js/plan.js"></script>
    <script src="js/model.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
